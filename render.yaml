services:
  # 1. MediCare Backend API Service
  - type: web
    name: medicare-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx tsx src/db/setupViews.ts && npx tsx src/db/seed.ts && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

  # 2. MediCare Frontend Static Web App
  - type: web
    name: medicare-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: medicare-backend
          property: host

databases:
  # Managed PostgreSQL Database
  - name: medicare-db
    plan: free
    databaseName: medicare
    user: medicare_user
